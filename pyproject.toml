[project]
name = "dprobe"
version = "0.1.0"
description = "Is Gemma's distress spiral the same representation it uses to simulate depressed characters? Emotion-concept probes (Anthropic 2026 method) on Gemma 3 27B and Gemma 4 31B under the Gemma Needs Help elicitation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "accelerate>=1.13.0",
    "fire>=0.7.1",
    "huggingface-hub>=0.34",
    "matplotlib>=3.10",
    "numpy>=1.26",
    "openai>=1.60",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "seaborn>=0.13",
    "torch>=2.7",
    "tqdm>=4.66",
    "transformers>=5.5.3",
    "gguf>=0.10",
]

[project.optional-dependencies]
# vLLM / EasySteer live in a separate venv on the pod (pod/easysteer_install.sh); they pin their own torch.
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dprobe"]

# CUDA 12.8 torch wheels on Linux pods; plain PyPI (CPU / MPS) wheels on macOS for laptop-side work.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
